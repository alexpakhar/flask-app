name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      run: |
        docker build -t flask-app-web:test .
        echo "Образ собран успешно"

    - name: Test image
      run: |
        docker run --rm flask-app-web:test python -c "print('Приложение работает')"
